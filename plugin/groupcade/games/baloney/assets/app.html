<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFDF7">
<title>Phony Baloney · Groupcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Groupcade "Sticker Book": cream paper, navy ink outlines, hard offset shadows. TV pages flip to navy. */
  --paper:#FFFDF7;--card:#fff;--text:#1B1F3B;--ink:#1B1F3B;--mist:#3A4366;--faint:#8A93AE;--soft:#C4C9DA;--white:#fff;
  --accent:#4A3AFF;--coral:#FF6B4A;--gold:#FFC93C;--mint:#3DD68C;--blue:#5BB8F5;--sky:#CFEBFF;
  --coral-t:#FFE3DA;--gold-t:#FFF4CF;--mint-t:#DDF8EA;--pink-t:#FFE0EE;
  --right:#12784A;--out:#B83A1E;
  --slate:var(--paper);--slate-2:var(--card);--slate-3:var(--gold-t);
  --a:#FF6B4A;--b:#FFC93C;--c:#3DD68C;--d:#5BB8F5;
  --line:#1B1F3B;--bw:3px;--sh:#1B1F3B;
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Baloo 2","Nunito",system-ui,sans-serif;
}
body.tv{--paper:#1B1F3B;--text:#fff;--mist:#CBD3F0;--card:#262B52;--line:#fff;--sh:#4A3AFF;--right:#3DD68C;--out:#FF8A70;--slate-3:#262B52}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--text);font-family:var(--body);font-weight:500;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:var(--bw) solid var(--ink);background:#fff}
body.tv .top{background:var(--paper);border-bottom-color:transparent}
.top .logo{width:44px;height:auto;flex:none;display:block}
.top .logo svg{width:100%;height:auto;display:block}
.brand{line-height:1}
.brand b{font-family:var(--display);font-weight:800;font-size:22px;display:block;color:var(--text)}
.brand span{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
body.tv .brand span{color:var(--gold)}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:var(--bw) solid var(--ink);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:800;color:var(--ink);background:var(--gold-t);white-space:nowrap}
.pill b{font-family:var(--display);letter-spacing:.12em;font-size:16px}
.pill.warn{background:var(--coral-t)}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:18px 18px 28px;display:flex;flex-direction:column;gap:16px}
body.hostview main{max-width:1280px}
.card{background:var(--card);border:var(--bw) solid var(--line);border-radius:22px;padding:18px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;line-height:1.05}
h1{font-size:clamp(30px,8vw,46px)}
h2{font-size:24px}
.muted{color:var(--mist)}
.small{font-size:14px}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:999px;border:var(--bw) solid var(--ink);background:#fff;color:var(--ink);font-weight:800;font-size:17px;text-decoration:none}
a.btn{color:var(--ink)}
.btn.go{background:var(--coral);color:var(--ink);font-family:var(--display);font-size:22px;box-shadow:4px 4px 0 var(--ink)}
.btn.go:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.go:disabled,.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.wide{width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
body.tv .btn.ghost{color:var(--gold)}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px}
.btn.go.sm{font-size:17px;box-shadow:3px 3px 0 var(--ink)}
label{display:block;font-size:15px;font-weight:800;color:var(--text);margin:0 0 6px}
input.field{width:100%;height:56px;border-radius:18px;border:var(--bw) solid var(--ink);background:#fff;color:var(--ink);padding:0 16px;font-size:19px;font-weight:800;outline:none}
input.field:focus{box-shadow:0 0 0 3px var(--gold)}
input.code{font-family:var(--display);letter-spacing:.3em;text-transform:uppercase;text-align:center;font-size:32px;height:66px}
.err{color:var(--out);font-weight:800;font-size:15px;min-height:1em}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-height:44px;padding:6px 14px;border-radius:999px;border:var(--bw) solid var(--soft);background:#fff;font-weight:700;font-size:15px;color:var(--mist)}
.seg button.on{border-color:var(--ink);color:var(--ink);background:var(--mint-t);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:var(--bw) solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px}
.chip.out{opacity:.45;text-decoration:line-through}
.chip.in{background:var(--mint-t)}
.chip .x{border:0;background:none;color:var(--mist);padding:0 0 0 2px;font-size:18px;line-height:1}
.chip.me{background:var(--gold-t)}
.chip .bd{width:26px;height:28px;margin:-2px 0 -2px -6px;flex:none}
.tag{display:inline-block;font-size:13px;font-weight:800;padding:2px 10px;border-radius:999px;border:var(--bw) solid var(--ink);background:#fff;color:var(--ink);text-transform:capitalize}
.tag.easy{background:var(--mint-t)}
.tag.medium{background:var(--gold-t)}
.tag.hard{background:var(--coral-t)}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800;font-size:15px;color:var(--mist)}
.meta .sp{flex:1}
.cat{display:inline-block;font-family:var(--body);font-weight:800;color:var(--ink);background:var(--mint);border:var(--bw) solid var(--ink);border-radius:999px;padding:2px 12px;font-size:14px}
.q{font-family:var(--display);font-weight:800;font-size:clamp(24px,6.4vw,32px);line-height:1.1;color:var(--ink)}
.card.qcard{box-shadow:5px 5px 0 var(--sh);transform:rotate(-.8deg);background:#fff;border-color:var(--ink)}
body.tv .card.qcard{border-color:var(--text);box-shadow:8px 8px 0 var(--accent)}
.timer{height:14px;border-radius:999px;background:#fff;overflow:hidden;border:var(--bw) solid var(--ink)}
.timer i{display:block;height:100%;background:var(--gold);width:100%;transform-origin:left;transition:background .3s}
.timer.low i{background:var(--coral)}
.secs{font-family:var(--display);font-weight:800;font-size:20px;color:var(--ink);min-width:2.4em;text-align:right}
.answers{display:grid;gap:10px}
.ans.press{background:var(--gold)!important;box-shadow:3px 3px 0 var(--ink)}
button.ans{touch-action:pan-y;transition:transform .18s ease;background:linear-gradient(90deg,rgba(255,201,60,calc(var(--p,0)*1)),rgba(255,201,60,calc(var(--p,0)*.5))),#fff}
html.coarse button.ans:not(:disabled)::after{content:"Slide right \203A";font-size:16px;white-space:nowrap;padding-left:8px;opacity:calc(.6 + var(--p,0)*.4)}
button.ans:not(:disabled)::after{content:"\203A";margin-left:auto;font-family:var(--display);font-size:28px;line-height:1;color:var(--ink);opacity:calc(.35 + var(--p,0)*.65)}
button.ans.nudge{animation:nudge .5s ease}
@keyframes nudge{30%{transform:translateX(22px)}60%{transform:translateX(-4px)}100%{transform:none}}
.readbar{text-align:center;font-weight:800;color:var(--accent);font-size:16px}
body.tv .readbar{color:var(--gold)}
.readbar b{font-family:var(--display);font-size:20px}
.hostview .readbar{font-size:clamp(18px,2vw,30px)}
.answers.wait .ans{opacity:.55}
.answers.wait button.ans::after,html.coarse .answers.wait button.ans::after{content:none}
.swipehint{text-align:left;font-size:14px;font-weight:800;color:var(--mist);margin:-4px 0 0}
#talkbtn{position:fixed;right:14px;bottom:calc(var(--bb,0px) + 14px);z-index:11;width:56px;height:56px;border-radius:50%;border:var(--bw) solid var(--ink);background:var(--gold);color:var(--ink);font-size:24px;display:none;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--ink)}
#talkbtn .ub{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--coral);border:2px solid var(--ink);color:var(--ink);font:800 12px/18px var(--body);padding:0 5px;display:none}
#bubbles{position:fixed;left:12px;right:80px;bottom:calc(var(--bb,0px) + 14px);z-index:8;display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none}
.bub{max-width:100%;background:#fff;color:var(--ink);border:var(--bw) solid var(--ink);border-radius:16px;padding:7px 12px;font-size:15px;font-weight:700;line-height:1.3;animation:bubin .25s ease;transition:opacity .4s;box-shadow:3px 3px 0 var(--ink)}
.bub b{color:var(--accent);margin-right:6px}
.bub.out{opacity:0}
@keyframes bubin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.hostview #bubbles{left:auto;right:20px;width:min(420px,40vw);align-items:flex-end}
.hostview .bub{font-size:clamp(16px,1.6vw,24px);padding:10px 16px}
#talksheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);color:var(--text);border-top:var(--bw) solid var(--ink);border-radius:24px 24px 0 0;padding:14px 14px max(14px,env(safe-area-inset-bottom));display:none;flex-direction:column;gap:10px;max-height:78vh}
#talksheet.on{display:flex}
#talksheet .hd{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:20px}
#talksheet .log{overflow-y:auto;min-height:60px;max-height:28vh;display:flex;flex-direction:column;gap:6px;font-size:15px}
#talksheet .log div b{color:var(--accent);margin-right:6px}
#talksheet .qp{display:flex;flex-wrap:wrap;gap:6px;max-height:30vh;overflow-y:auto}
#talksheet .qp button{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700}
#talksheet form{display:flex;gap:8px}
#talksheet input{flex:1;min-width:0;border-radius:16px;border:var(--bw) solid var(--ink);background:#fff;color:var(--ink);padding:10px 12px;font-size:16px}
.hostview .answers{margin:0}
.ans{position:relative;display:flex;align-items:center;gap:12px;min-height:64px;width:100%;text-align:left;border-radius:20px;border:var(--bw) solid var(--ink);background:#fff;color:var(--ink);padding:8px 14px 8px 8px;font-weight:800;font-size:18px;line-height:1.2}
.ans .L{flex:none;width:42px;height:42px;border-radius:14px;border:var(--bw) solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:20px;color:var(--ink)}
.ans[data-l="0"] .L{background:var(--a)}
.ans[data-l="1"] .L{background:var(--b)}
.ans[data-l="2"] .L{background:var(--c)}
.ans[data-l="3"] .L{background:var(--d)}
.ans .n{margin-left:auto;font-family:var(--display);font-weight:800;color:var(--ink);font-size:20px}
.ans:disabled{cursor:default}
.ans.pick{background:var(--gold-t)}
.ans.dim{opacity:.5}
.ans.good{background:var(--mint-t);opacity:1;box-shadow:4px 4px 0 var(--ink)}
.ans.bad{background:var(--coral-t);opacity:1}
.banner{border-radius:20px;padding:14px 16px;font-weight:800;font-size:18px;border:var(--bw) solid var(--ink);background:var(--gold-t);color:var(--ink)}
.banner.good{background:var(--mint-t)}
.banner.bad{background:var(--coral-t)}
.banner.info{background:var(--gold-t)}
.banner small{display:block;font-weight:700;color:var(--mist);font-size:15px;margin-top:4px}
body.tv .banner small{color:#3A4366}
.big-code{font-family:var(--display);font-weight:800;letter-spacing:.12em;font-size:clamp(48px,9vw,120px);line-height:1;color:var(--text)}
.qr{background:#fff;border-radius:18px;border:var(--bw) solid var(--ink);padding:10px;display:inline-block;line-height:0}
.qr img,.qr canvas{width:100%;height:auto;image-rendering:pixelated}
.reel{font-family:var(--display);font-weight:800;font-size:clamp(32px,8vw,64px);color:var(--accent);min-height:1.2em}
body.tv .reel{color:var(--gold)}
.win{font-family:var(--display);font-weight:800;font-size:clamp(36px,9vw,84px);color:var(--text);line-height:1.02;word-break:break-word}
.stand{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.stand li{display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border:var(--bw) solid var(--ink);border-radius:18px;padding:6px 14px 6px 8px;font-weight:800}
.stand .r{font-family:var(--display);width:1.6em;text-align:center;font-size:20px}
.stand .bd{width:34px;height:36px;flex:none}
.stand li.w{background:var(--mint-t)}
.stand .s{margin-left:auto;color:#3A4366;font-size:14px;font-weight:700}
.stand li b,.stand li span{color:var(--ink)}
.stand .s,.stand .s span{color:#3A4366}
.hoststrip{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;gap:6px;justify-content:center;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--ink);border-radius:24px 24px 0 0;flex-wrap:nowrap;overflow-x:auto}
.hoststrip .btn{white-space:nowrap;flex:none;padding:0 12px;font-size:14px;min-height:40px;background:transparent;color:#ffffff;border-color:#ffffff}
.hoststrip .btn.go{background:var(--accent);color:#ffffff;font-family:var(--body);font-size:14px;box-shadow:none}
.hoststrip .pill{background:transparent;color:#ffffff;border-color:#ffffff}
@media (max-width:420px){.hoststrip .pill{display:none}}
.hoststrip.mini{top:6px;bottom:auto!important;right:6px;left:auto;background:none;padding:0;border-radius:0}
.hoststrip.mini .btn{min-height:32px;font-size:12px;opacity:.85}
.still{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--sky);border-top:var(--bw) solid var(--ink);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.still::-webkit-scrollbar{display:none}
.still .lbl{flex:none;font-size:14px;font-weight:800;color:var(--ink)}
.still .chip{flex:none;padding:2px 10px;font-size:14px}
.hostview .still{padding:10px 16px}
.hostview .still .chip{font-size:16px;padding:4px 14px}
.foot{padding:14px 16px;text-align:center;font-size:13px;color:var(--mist);border-top:var(--bw) solid var(--ink)}
.foot a{color:var(--mist)}
.or{display:flex;align-items:center;gap:10px;color:var(--mist);font-weight:800;font-size:14px}
.or:before,.or:after{content:"";flex:1;height:3px;border-radius:2px;background:var(--soft)}
.rules{margin:0;padding-left:20px;color:var(--mist);font-size:15px;line-height:1.55}
.verdict{font-weight:800;font-size:19px;color:var(--ink)}
.verdict .ko{color:var(--out)}
.verdict .ok{color:var(--right)}
.card .verdict .muted,.card .stand + *{color:var(--mist)}
/* Host screen on a laptop: the web version of the host controls */
.hgrid{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:16px;align-items:start}
.hostview .q{font-size:clamp(26px,3.2vw,48px)}
.hostview .answers{grid-template-columns:1fr 1fr}
.hostview .ans{min-height:84px;font-size:clamp(18px,1.9vw,28px)}
.hostview .ans .L{width:52px;height:52px;font-size:24px}
.hostview .timer{height:16px}
.hostview .secs{font-size:24px}
.stat{font-family:var(--display);font-weight:800}
@media (max-width:820px){.hgrid{grid-template-columns:1fr}.hostview .answers{grid-template-columns:1fr}}
body.tv .foot{display:none}
body.tv main{max-width:none;padding:3.4vh 4.4vw 4vh;gap:3vh}
/* ---------- The TV screen (AirPlay, Chromecast, TV browser): full screen, sized to the screen ---------- */
body.tv{font-size:1.9vh}
body.tv .top{display:none}
.tvl{display:flex;gap:3.8vw;flex:1;min-height:0}
.tvl .left{width:39vw;flex:none;display:flex;flex-direction:column;gap:3vh}
.tvl .right{flex:1;min-width:0;display:flex;flex-direction:column;gap:2.5vh}
.tvlogo{height:9vh;width:auto;align-self:flex-start;display:block}
.tvlogo svg{height:100%;width:auto;display:block}
.joincard{background:var(--sky);color:var(--ink);border:.55vh solid #fff;border-radius:4.7vh;box-shadow:1.1vh 1.1vh 0 var(--accent);padding:3.6vh 3.9vh;transform:rotate(-1.5deg);display:flex;flex-direction:column;gap:.8vh}
.joincard .l1{font-weight:800;font-size:3.3vh}
.joincard .url{font-family:var(--display);font-weight:800;font-size:5.6vh;line-height:1.05;overflow-wrap:anywhere}
.joincard .l2{font-weight:800;font-size:3vh;margin-top:1.4vh}
.tiles{display:flex;gap:1.7vh}
.tiles span{width:12vh;height:13.6vh;border:.55vh solid var(--ink);border-radius:2.8vh;box-shadow:.55vh .55vh 0 var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:9.4vh;line-height:1}
.tiles span:nth-child(1){background:var(--coral)}.tiles span:nth-child(2){background:var(--gold)}.tiles span:nth-child(3){background:var(--mint)}.tiles span:nth-child(4){background:#fff}
.qrrow{display:flex;align-items:center;gap:2.5vh;margin-top:auto}
.qrrow .qr{width:16.4vh;height:16.4vh;padding:1.4vh;border:0;border-radius:2.5vh}
.qrrow p{margin:0;font-size:3vh;font-weight:700;color:var(--mist);line-height:1.3}
.tvh{display:flex;align-items:baseline;justify-content:space-between;padding-top:1.4vh}
.tvh h1{font-size:7vh}
.count{background:var(--mint);color:var(--ink);border-radius:999px;padding:.8vh 2.5vh;font-weight:800;font-size:3vh}
.pgrid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:2.5vh;align-content:start}
.pcard{color:var(--ink);border:.55vh solid #fff;border-radius:3.6vh;padding:1.9vh 1.4vh 1.7vh;display:flex;flex-direction:column;align-items:center;gap:.6vh;min-width:0}
.pcard .bd{height:var(--bh,12.8vh);width:auto}
.pcard b{font-family:var(--display);font-weight:800;font-size:var(--nf,4.2vh);line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard.more{border-style:dashed;border-color:#5A6290;color:var(--mist);justify-content:center;text-align:center;font-size:3vh;font-weight:700}
.tvfoot{margin-top:auto;display:flex;align-items:center;gap:2vh;font-size:3.3vh;font-weight:700;color:var(--mist)}
.tvfoot .m{height:7.5vh;width:auto}
.tvbar{display:flex;align-items:center;gap:2.5vh}
.tvbar .m{height:8vh;display:block}
.tvbar .m svg,.tvlogo svg,.disc .m svg{height:100%;width:auto;display:block}
.tvbar .rd{font-weight:800;font-size:3.6vh}
.tvbar .catp{background:var(--mint);color:var(--ink);border-radius:999px;padding:.6vh 2.2vh;font-weight:800;font-size:3vh}
.tvbar .sp{flex:1}
.tvbar .room{font-size:3vh;font-weight:700;color:var(--mist)}
.clock{width:12.8vh;height:12.8vh;border-radius:50%;background:var(--gold);color:var(--ink);border:.55vh solid #fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:6.4vh;line-height:1}
.clock.low{background:var(--coral)}
.tvq{background:#fff;color:var(--ink);border:.55vh solid #fff;border-radius:5vh;box-shadow:1.1vh 1.1vh 0 var(--accent);padding:4.7vh 6vh;transform:rotate(-.6deg)}
.tvq h1{font-size:clamp(4vh,8.3vh,8.3vh);line-height:1.05;color:var(--ink)}
.tvq.long h1{font-size:6.2vh}
.tvans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2.8vh}
.tva{min-height:14.4vh;background:#262B52;border:.55vh solid var(--col);border-radius:3.9vh;display:flex;align-items:center;gap:2.8vh;padding:1.2vh 2.2vh;transition:opacity .3s,transform .3s}

<body>
<header class="top">
  <a class="logo" href="#" id="home-link" aria-label="Groupcade Phony Baloney home">{{LOGO}}</a>
  <div class="brand"><b>Groupcade</b><span>Phony Baloney</span></div>
  <div class="sp"></div>
  <div id="toppill"></div>
</header>
<main id="app" aria-live="polite"></main>
<div id="strip"></div>
<div id="still"></div>
<template id="tvlogo">{{LOGOTV}}</template><template id="mascot">{{MASCOT}}</template>
<footer class="foot"><a href="/" id="site-link">Groupcade</a> · Party games for the big screen.</footer>
<script>{{QRLIB}}</script>
<script>
(function(){
"use strict";
var CFG = {{CONFIG}};
var app = document.getElementById('app');
var topPill = document.getElementById('toppill');
var strip = document.getElementById('strip');
var stillEl = document.getElementById('still');
var coarse = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
if (coarse) document.documentElement.classList.add('coarse');

// ---------------------------------------------------------------- storage (per device)
function sget(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function sset(k,v){ try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k,v); } catch(e){} }

var S = {
  mode: 'home',   // home | join | host | play
  code: (CFG.code || '').toUpperCase(),
  token: null, host: null, name: sget('gc_name') || '',
  tv: !!CFG.tv, st: null, offset: 0, sig: '', timer: null, err: '', busy: false, net: true, pendingAns: 0
};

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function nowS(){ return Date.now() + S.offset; }
function link(code){ return CFG.party + code; }
function shortLink(){ return CFG.party.replace(/^https?:\/\//,'').replace(/\/$/,''); }
function pathOf(u){ return u.replace(/^https?:\/\/[^\/]+/, ''); }
function onPath(u){ return location.pathname.indexOf(pathOf(u)) === 0; } // false on the REST fallback page

// ---------------------------------------------------------------- API
function api(method, path, body){
  var h = { 'X-Groupcade': '1' };
  if (S.token) h['X-Party-Token'] = S.token;
  if (S.host) h['X-Party-Host'] = S.host;
  var o = { method: method, headers: h, cache: 'no-store', credentials: 'same-origin' }; // Sends the host's account cookie, if any.
  if (body) { h['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
  var url = CFG.api + path + (method === 'GET' ? (path.indexOf('?') < 0 ? '?' : '&') + '_=' + Date.now() : '');
  return fetch(url, o).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if (!r.ok) { var e = new Error(j.message || ('Error ' + r.status)); e.status = r.status; e.code = j.code; throw e; }
      return j;
    });
  });
}

// ---------------------------------------------------------------- navigation
function setUrl(code){
  if (!onPath(CFG.party)) return; // REST fallback page or TV page: leave the URL alone
  var p = code ? pathOf(CFG.party) + code + '/' : pathOf(CFG.party);
  try { history.replaceState(null, '', p); } catch(e){}
}

function goHome(){
  stopPoll(); S.mode = 'home'; S.code = ''; S.st = null; S.token = null; S.host = null; S.err = '';
  if (CFG.tv || CFG.cast) { S.mode = 'tv'; if (onPath(CFG.tvLink)) { try { history.replaceState(null, '', pathOf(CFG.tvLink)); } catch(e){} } render(true); return; }
  document.body.classList.remove('hostview'); setUrl(''); render(true);
}
document.getElementById('site-link').href = CFG.site;
document.getElementById('home-link').addEventListener('click', function(e){ e.preventDefault(); goHome(); });

function enterRoom(code, asHost){
  S.code = code;
  S.host = sget('gc_host_' + code);
  S.token = sget('gc_tok_' + code);
  S.mode = (asHost && S.host) ? 'host' : (S.token ? 'play' : 'join');
  if (!asHost && !S.token) { S.mode = 'join'; }
  document.body.classList.toggle('hostview', S.mode === 'host');
  setUrl(code); S.st = null; S.sig = ''; render(true);
  if (S.mode !== 'join') poll(); else peek();
  if (S.mode === 'host') wake();
  if (Cast.on) Cast.send();
}

// TV view: watch only, no controls, no player token. The host runs the game from their phone.
function enterTv(code){
  stopPoll();
  S.mode = 'tv'; S.code = code; S.token = null; S.host = null; S.st = null; S.sig = ''; S.err = '';
  document.body.classList.add('hostview', 'tv');
  if (onPath(CFG.tvLink)) { try { history.replaceState(null, '', pathOf(CFG.tvLink) + code + '/'); } catch(e){} }
  render(true); poll(); wake();
}
var wl = null;
function wake(){
  if (!('wakeLock' in navigator) || wl) return;
  navigator.wakeLock.request('screen').then(function(l){ wl = l; l.addEventListener('release', function(){ wl = null; }); }).catch(function(){});
}

// Before joining, check the code is real (and show who's in).
function peek(){
  var token = S.token; S.token = null;
  api('GET', '/rooms/' + S.code).then(function(st){ S.st = st; S.err = ''; render(true); })
    .catch(function(e){ S.err = e.message; render(true); });
  S.token = token;
}

// ---------------------------------------------------------------- polling
function stopPoll(){ if (S.timer) { clearTimeout(S.timer); S.timer = null; } }
// One poll chain at a time. Answers and host actions call poll() while another request may still be
// in flight; an older response arriving late must never overwrite a newer one (that made picks flicker).
var pollSeq = 0, pollApplied = 0;
function poll(){
  stopPoll();
  var my = ++pollSeq;
  var known = (S.st && S.st.h && S.st.code === S.code && !S.st.gone) ? S.st.h : '';
  api('GET', '/rooms/' + S.code + '?chat=' + talkSince() + (known ? '&h=' + known : '')).then(function(st){
    if (my < pollApplied) return;
    // Nothing changed since our last copy: the server sends only the clock and new chat.
    if (st.same) {
      // Our copy changed while this was in flight (a host action, say): ask again for the whole room.
      if (!S.st || S.st.h !== st.h) { if (S.st) S.st.h = ''; if (my === pollSeq) S.timer = setTimeout(poll, 0); return; }
      var keep = S.st; keep.now = st.now; keep.chat = st.chat; st = keep;
    }
    chatFeed(st.chat, st.me ? st.me.name : '');
    pollApplied = my;
    S.net = true;
    S.offset = st.now - Date.now();
    // The room belongs to another game: load that game's page (the server picks it from the code).
    if (st.game && st.game !== CFG.game) { location.replace(S.mode === 'tv' ? CFG.tvLink + S.code + '/' : CFG.site + 'join/' + S.code + '/'); return; }
    if (st.gone && S.mode === 'play') {
      sset('gc_tok_' + S.code, null); S.token = null; S.mode = 'join';
      S.err = 'You were removed from this game. You can join again with a new name.'; S.st = st; render(true); return;
    }
    fixPend(st);
    S.st = st; render(false);
    if (my === pollSeq) S.timer = setTimeout(poll, delay());
  }).catch(function(e){
    if (my < pollApplied) return;
    if (e.status === 404) { S.err = e.message; S.st = null; stopPoll(); if (S.mode === 'tv') { S.code = ''; } render(true); return; }
    S.net = false; render(false);
    if (my === pollSeq) S.timer = setTimeout(poll, 3000);
  });
}
document.addEventListener('visibilitychange', function(){ if (!document.hidden && S.code && S.mode !== 'home' && S.mode !== 'join') { poll(); if (S.mode === 'tv' || S.mode === 'host') wake(); } });

function accountLink(extra){ return CFG.site + 'account/' + (extra || ''); }
function saveCard(st){
  if (st.owned) return '<p class="muted small center" style="margin:0">Saved to <a href="' + esc(accountLink()) + '" style="color:var(--text)">your game history</a>.</p>';
  var to = accountLink('?claim=' + st.code + '&next=' + encodeURIComponent(pathOf(link(st.code)) + '/'));
  return '<div class="card center" style="background:var(--mint-t)"><h2 style="font-size:20px">Keep this game?</h2><p class="muted small" style="margin:6px 0 12px">Sign in to save who won, keep your setup for next time and write your own questions. It\'s optional and takes a few seconds.</p><a class="btn" href="' + esc(to) + '">Save my games</a></div>';
}

function joinRoom(code, name){
  code = (code || '').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
  name = (name || '').trim();
  if (code.length !== 4) { S.err = 'The code is 4 letters.'; render(true); return; }
  if (!name) { S.err = 'Type a name so people know who you are.'; render(true); return; }
  S.busy = true; S.err = ''; S.code = code; render(true);
  sset('gc_name', name); S.name = name;
  S.token = sget('gc_tok_' + code);
  api('POST', '/rooms/' + code + '/join', { name: name }).then(function(r){
    sset('gc_tok_' + code, r.token); S.token = r.token; S.busy = false;
    S.host = sget('gc_host_' + code);
    S.mode = 'play'; document.body.classList.remove('hostview'); setUrl(code); S.sig=''; poll();
  }).catch(function(e){ S.busy = false; S.err = e.message; render(true); });
}
function hostDo(action, extra){
  var b = extra || {}; b.action = action;
  return api('POST', '/rooms/' + S.code + '/host', b).then(function(st){ S.offset = st.now - Date.now(); if (S.mode === 'host') { S.st = st; render(true); } poll(); })
    .catch(function(e){ alertMsg(e.message); });
}
// ---------------------------------------------------------------- trash talk

  }).catch(function(e){ S.busy = false; S.err = e.message; render(true); });
}
function savePrefs(o){

}
function loadAccount(){
  if (CFG.tv || CFG.cast) return;

function signInNote(){

// ---------------------------------------------------------------- player actions
function sendFake(text){
  var st = S.st; text = (text || '').replace(/\s+/g, ' ').trim();
  if (!st || st.phase !== 'write') return;
  if (!text) { S.fakeErr = 'Type a fake answer first.'; render(true); return; }
  S.busy = true; S.fakeErr = '';
  var round = st.round;
  api('POST', '/rooms/' + S.code + '/action', { type: 'fake', round: round, text: text }).then(function(){
    S.busy = false; S.fakeSent = { round: round, text: text }; S.editFake = 0; S.draft = null; S.typing = 0;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (S.st && S.st.me && S.st.round === round) S.st.me.fake = text;
    render(true); poll();
  }).catch(function(e){
    S.busy = false; S.typing = 0; S.fakeErr = e.message; render(true);
    var fk = document.getElementById('fk'); if (fk && e.code === 'tootrue') { fk.select(); }
  });
}
function vote(c){
  var st = S.st; if (!st || st.phase !== 'vote' || !st.me) return;
  if ((st.me.own || []).indexOf(c) >= 0) return;
  S.pend = { round: st.round, vote: c }; st.me.vote = c; render(true);
  api('POST', '/rooms/' + S.code + '/action', { type: 'vote', round: st.round, choice: c }).then(function(){ poll(); })
    .catch(function(e){ S.pend = null; alertMsg(e.message); poll(); });
}
function giveLol(i){
  var st = S.st; if (!st || !st.me || st.me.lol >= 0) return;
  st.me.lol = i; render(true);
  api('POST', '/rooms/' + S.code + '/action', { type: 'lol', round: st.round, choice: i }).then(function(){ poll(); })
    .catch(function(e){ if (S.st && S.st.me) S.st.me.lol = -1; alertMsg(e.message); poll(); });
}

// ---------------------------------------------------------------- shared pieces
function roundTxt(st){ return 'Round ' + st.round + ' of ' + st.rounds; }
function blankify(q){ return esc(q).replace(/_{3,}/g, '<span class="blank">&nbsp;</span>'); }
function promptInner(p){
  var img = p.img ? '<img class="pimg" src="' + esc(p.img) + '" alt="' + esc(p.title || p.catN) + '">' : '';
  var title = p.title ? '<div class="ptitle">' + esc(p.title) + '</div>' + (p.sub ? '<div class="psub">' + esc(p.sub) + '</div>' : '') : (p.sub ? '<div class="psub">' + esc(p.sub) + '</div>' : '');
  return '<div class="pbody">' + img + '<div class="ptext">' + title + '<div class="pq">' + blankify(p.q) + '</div></div></div>';
}
function promptHtml(st, mini){
  if (!st.p) return '';
  return '<div class="card qcard' + (mini ? ' mini' : '') + '"><div class="cat">' + esc(st.p.catN) + '</div><div style="height:10px"></div>' + promptInner(st.p) + (mini ? '' : '<div style="height:14px"></div>' + timerHtml(st)) + '</div>';
}
function tvPrompt(st, mini){ return st.p ? '<div class="tvprompt' + (mini ? ' mini' : '') + '">' + promptInner(st.p) + '</div>' : ''; }
function doubleTag(st){ return st.mult > 1 && st.phase !== 'end' ? '<span class="tag" style="background:var(--gold)">Double points</span>' : ''; }

function scoreboard(st, n, meName){
  var ps = st.players.slice().sort(function(a, b){ return (b.score - a.score) || a.name.localeCompare(b.name); });
  var showGain = st.phase === 'rev' || st.phase === 'board';
  return '<ol class="stand">' + ps.slice(0, n).map(function(p){
    var r = 1; ps.forEach(function(q){ if (q.score > p.score) r++; });
    return '<li class="' + (r === 1 && p.score > 0 ? 'w' : '') + '"><span class="r">' + r + '</span>' + buddySvg(idxOf(st, p.name)) + '<span' + (p.name === meName ? ' style="color:var(--accent)"' : '') + '>' + esc(p.name) + '</span><span class="s">' + (p.gain && showGain ? '<span style="color:#12784A">+' + num(p.gain) + '</span> · ' : '') + '<b style="color:var(--ink)">' + num(p.score) + '</b></span></li>';
  }).join('') + '</ol>';
}

// The reveal: one choice at a time (the ones somebody picked, the truth last), on a clock shared by every screen.
function revShown(st){ return st.res ? st.res.rev.filter(function(o){ return o.truth || o.votes.length; }) : []; }
function revStep(st){
  var n = revShown(st).length;
  if (st.phase !== 'rev') return n - 1;
  return Math.min(n - 1, Math.floor((nowS() - st.t0 - STEP0) / STEP_MS));
}
function revDone(st){ return revStep(st) >= revShown(st).length - 1; }
function whoTag(o){
  if (o.truth) return '<span class="truthtag">The truth!</span>';
  if (o.house) return '<span class="tag">House fake</span>';
  return '<span class="tag">Fake by ' + o.by.map(esc).join(' &amp; ') + '</span>' + (o.pts ? '<b class="plus">+' + num(o.pts) + '</b>' : '');
}
function revCard(st, o, cur){
  var v = o.votes.length ? '<div class="voters">' + o.votes.map(function(n){ return '<span class="chip">' + buddySvg(idxOf(st, n)) + esc(n) + '</span>'; }).join('') + '</div>'
    : '<div class="muted small">Nobody picked it</div>';
  var lab = o.votes.length ? '<div class="muted small" style="font-weight:800">' + (o.truth ? 'Found it' : 'Fell for it') + '</div>' : '';
  return '<div class="rcard' + (o.truth ? ' truth' : '') + (cur ? ' cur pop' : '') + '"><div class="rt">“' + esc(o.t) + '”</div>' + lab + v + '<div class="rw">' + whoTag(o) + '</div></div>';
}
function unpicked(st){
  var u = st.res ? st.res.rev.filter(function(o){ return !o.truth && !o.votes.length; }) : [];
  if (!u.length) return '';
  return '<p class="muted small nob" style="margin:0">Nobody fell for ' + u.map(function(o){ return '“' + esc(o.t) + '”' + (o.house ? ' (house)' : ' (' + o.by.map(esc).join(' &amp; ') + ')'); }).join(', ') + '.</p>';
}
function revList(st){
  var shown = revShown(st), k = revStep(st);
  S.revStep = k;
  if (k < 0) return '<div class="card center"><div class="waiting">Let\'s see who fell for what…</div></div>';
  return '<div class="rlist">' + shown.slice(0, k + 1).reverse().map(function(o, j){ return revCard(st, o, j === 0 && st.phase === 'rev'); }).join('') + '</div>' + (k >= shown.length - 1 ? unpicked(st) : '');
}
function stickersHtml(st, me){
  var a = [];
  (st.awards || []).forEach(function(x){
    if (x.k === 'lol') a.push('<div class="sticker">😂 Funniest<b>' + esc(x.name) + '</b>' + x.n + ' LOL' + (x.n === 1 ? '' : 's') + '</div>');
    if (x.k === 'fool') a.push('<div class="sticker">🦊 Sneakiest fake<b>' + esc(x.name) + '</b>fooled ' + x.n + '</div>');
    if (x.k === 'truth') a.push('<div class="sticker">🔎 Truth hound<b>' + esc(x.name) + '</b>found it ' + x.n + '×</div>');
  });
  return a.length ? '<div class="stickers">' + a.join('') + '</div>' : '';
}

// ---------------------------------------------------------------- timer and reel
function tickTimer(){
  var st = S.st;
  if (st && st.phase === 'rev' && S.revStep !== undefined && revStep(st) !== S.revStep && !S.typing) { render(true); return; }
  var bar = document.getElementById('tbar'), sec = document.getElementById('tsec');
  if (!st || !bar || (st.phase !== 'write' && st.phase !== 'vote')) { if (sec && st && st.phase !== 'write' && st.phase !== 'vote') sec.textContent = ''; return; }
  var total = st.t1 - st.t0, left = Math.max(0, st.t1 - nowS());
  var f = total > 0 ? left / total : 0;
  bar.firstChild.style.transform = 'scaleX(' + f.toFixed(4) + ')';
  bar.classList.toggle('low', left < 8000);
  if (sec) sec.textContent = Math.ceil(left / 1000) + (sec.getAttribute('data-bare') ? '' : 's');
  if (sec && sec.classList.contains('clock')) sec.classList.toggle('low', left < 8000);
}
var reelT = null;
function spinReel(st){
  var el = document.getElementById('reel'); if (!el || !st.p) return;
  clearInterval(reelT);
  var names = CATS.map(function(c){ return c.name; }).filter(function(c){ return c !== st.p.catN; });
  var stopAt = st.t0 + Math.min(2200, (st.t1 - st.t0) * 0.6), i = 0;
  var done = function(){ el.textContent = st.p.catN; var h = document.getElementById('cathint'); if (h) h.style.visibility = 'visible'; };
  if (nowS() >= stopAt || !names.length) { done(); return; }
  reelT = setInterval(function(){
    if (nowS() >= stopAt) { clearInterval(reelT); done(); el.classList.add('pop'); return; }
    el.textContent = names[i++ % names.length];
  }, 90);
}
function countFake(fk){
  var n = document.getElementById('fkn'); if (n) n.textContent = (MAXLEN - fk.value.length) + ' left';
}

  }
  if (st.phase === 'vote') {
    // Longer fakes get two columns and smaller type so a full table of 9 still fits.
    var n = (st.opts || []).length, most = Math.max.apply(null, (st.opts || []).map(function(t){ return t.length; }).concat([0]));
    var long = most > 38, vlong = most > 70;
    var oc = n > 6 ? 3 : n <= 4 || long ? 2 : 3, of = vlong ? (n > 6 ? '2.5vh' : n > 4 ? '3vh' : '3.4vh') : n > 6 ? (long ? '3vh' : '3.8vh') : (long ? '3.6vh' : '4.4vh');
    return bar + tvPrompt(st, true) + '<div class="tvopts' + (vlong ? ' vlong' : '') + '" style="--oc:' + oc + ';--of:' + of + '">' + st.opts.map(function(t, i){
      return '<div class="tva" style="--col:' + COLS[i % COLS.length] + '"><span class="k">' + LET[i] + '</span><span class="t">' + esc(t) + '</span></div>';
    }).join('') + '</div>' + tvHeads(st, 'voted');
  }
  if (st.phase === 'rev') {
    var shown = revShown(st), k = revStep(st);
    S.revStep = k;
    var body;
    if (k < 0) body = '<div class="tvcat"><div class="lab">Votes are in.</div><div class="reel" style="font-size:9vh">Let\'s see who fell for what…</div></div>';
    else body = '<div class="tvrev">' + (k > 0 ? '<div class="past">' + shown.slice(0, k).map(function(o){ return '<span' + (o.truth ? ' class="t"' : '') + '>“' + esc(o.t.length > 34 ? o.t.slice(0, 32) + '…' : o.t) + '” · ' + (o.truth ? 'truth' : o.house ? 'house fake' : esc(o.by.join(' & '))) + '</span>'; }).join('') + '</div>' : '') +
      revCard(st, shown[k], true) + (k >= shown.length - 1 ? unpicked(st) + '<div class="tvwait">Phones: give the funniest fake a 😂 LOL sticker.</div>' : '') + '</div>';
    return bar + tvPrompt(st, true) + body;
  }
  if (st.phase === 'board') {
    return bar + '<div class="tvboard"><h2>Scores after round ' + st.round + '</h2>' + scoreboard(st, 8) + (st.round + 1 === st.rounds && st.rounds >= 3 ? '<div class="tvhint">Last round: double points!</div>' : '') + '</div>';
  }
  var w = st.winners || [], wi = w.length ? idxOf(st, w[0]) : 0;
  return '<div class="tvwin"><div class="hero"><div class="lab">' + (w.length > 1 ? 'Winners' : w.length ? 'Winner' : (st.stopped ? 'Game over' : 'No winner')) + '</div>' +
    '<div class="disc pop">' + (w.length ? buddySvg(wi, true) : '<span class="m" style="height:24vh;display:block">' + mascotHtml() + '</span>') + '</div>' +
    '<div class="win">' + (w.length === 1 ? esc(w[0]) + ' wins!' : winnersTxt(st)) + '</div>' +
    '<div class="sub">' + (st.round ? 'Most points after ' + st.round + ' round' + (st.round === 1 ? '' : 's') : '') + '</div></div>' +
    '<div class="board">' + stickersHtml(st) + '<h2>Final scores</h2>' + scoreboard(st, 6) + '<p class="tvwait" style="margin:1vh 0 0">Waiting for the host to start the next game…</p></div></div>';
}

// ---------------------------------------------------------------- phone
function vPlay(st){
  var me = st.me || { name: S.name, score: 0, gain: 0, fake: '', vote: 0, lol: -1, own: [] };
  if (st.phase === 'lobby') {
    return '<div class="card center pop"><p class="muted" style="margin:0 0 6px;font-weight:700">You\'re in</p><h1>' + esc(me.name) + '</h1><p class="muted" style="margin:10px 0 0">Waiting for the host to start…</p></div>' +
      '<div class="card"><div class="meta"><span>Players</span><span class="sp"></span><span class="stat" style="color:var(--text)">' + st.players.length + '</span></div><div style="height:10px"></div><div class="chips">' +
      st.players.map(function(p, i){ return '<span class="chip' + (p.name === me.name ? ' me' : '') + '">' + buddySvg(i) + esc(p.name) + '</span>'; }).join('') + '</div></div>' +
      '<div class="card">' + rulesHtml() + '</div><button class="btn ghost wide sm" data-act="leave">Leave room</button>';
  }
  var head = '<div class="meta"><span>' + roundTxt(st) + '</span>' + doubleTag(st) + '<span class="sp"></span><span><span class="stat" style="color:var(--text)">' + num(me.score) + '</span> pts · ' + ord(rankOf(st, me.name) || 1) + '</span></div>';
  if (st.phase === 'cat') return head + catCard(st);
  if (st.phase === 'write') {
    var sent = me.fake || (S.fakeSent && S.fakeSent.round === st.round ? S.fakeSent.text : '');
    var editing = !sent || S.editFake === st.round;
    var val = (S.draft !== null && S.draft !== undefined && S.draftRound === st.round) ? S.draft : sent;
    var form = editing
      ? '<form id="fakef" class="card"><label for="fk">Your fake answer</label><textarea id="fk" class="field" maxlength="' + MAXLEN + '" rows="3" placeholder="Something that sounds true…" autocomplete="off" autocapitalize="sentences" enterkeyhint="send">' + esc(val) + '</textarea>' +
        '<div class="err" role="alert" style="margin-top:8px">' + esc(S.fakeErr || '') + '</div>' +
        '<div class="row" style="justify-content:space-between"><span class="muted small" id="fkn"></span><button class="btn go sm" ' + (S.busy ? 'disabled' : '') + '>' + (sent ? 'Update my fake' : 'Lock in my fake') + '</button></div></form>'
      : '<div class="banner good pop">Your fake: “' + esc(sent) + '”<small>Nice. You can change it until the clock runs out.</small></div><button class="btn wide sm" data-act="editfake">Change my fake</button>';
    return head + promptHtml(st) + form + '<p class="muted small center" style="margin:0">' + st.locked + ' of ' + st.alive + ' fakes in</p>';
  }
  if (st.phase === 'vote') {
    var own = me.own || [];
    return head + promptHtml(st) + '<p class="swipehint">' + (me.vote ? 'Tap another one to change your vote.' : 'Which one is real? Tap it.') + '</p><div class="answers">' + (st.opts || []).map(function(t, i){
      var c = i + 1, mine = own.indexOf(c) >= 0, pick = me.vote === c;
      return '<button class="ans vopt' + (pick ? ' pick' : '') + (mine ? ' own' : '') + '" data-vote="' + c + '"' + (mine ? ' disabled' : '') + '><span class="L" style="background:' + COLS[i % COLS.length] + '">' + LET[i] + '</span><span>' + esc(t) + '</span>' +
        (mine ? '<span class="n small">Yours</span>' : (pick ? '<span class="n small" style="color:var(--accent)">Your vote</span>' : '')) + '</button>';
    }).join('') + '</div><p class="muted small center" style="margin:0">' + st.locked + ' of ' + st.alive + ' voted</p>';
  }
  if (st.phase === 'rev' || st.phase === 'board') {
    var res = st.res || { rev: [] }, done = st.phase === 'board' || revDone(st);
    S.revStep = revStep(st);
    var lol = lolHtml(st, me);
    if (!done) return head + '<div class="card center"><h2>Eyes on the big screen!</h2><p class="muted" style="margin:8px 0 0">The truth is coming…</p></div>' + lol;
    var truth = res.rev.filter(function(o){ return o.truth; })[0] || { t: '' };
    var found = truth.votes && truth.votes.indexOf(me.name) >= 0;
    var fell = res.rev.filter(function(o){ return !o.truth && o.votes.indexOf(me.name) >= 0; })[0];
    var mine = res.rev.filter(function(o){ return o.by.indexOf(me.name) >= 0; })[0];
    var ban = found ? '<div class="banner good pop">You found the truth! +' + num(1000 * (res.mult || 1)) + '</div>'
      : fell ? '<div class="banner bad pop">You fell for “' + esc(fell.t) + '”<small>' + (fell.house ? 'That was a house fake.' : 'Written by ' + fell.by.map(esc).join(' &amp; ') + '.') + '</small></div>'
      : '<div class="banner bad pop">No vote this round.</div>';
    var fool = mine ? '<div class="banner ' + (mine.votes.length ? 'good' : 'info') + '">' + (mine.votes.length ? 'Your fake fooled ' + mine.votes.length + '! +' + num(mine.pts) : 'Your fake didn\'t fool anyone this time.') + '<small>“' + esc(mine.t) + '”</small></div>' : '';
    return head + ban + fool + '<div class="card"><p class="muted small" style="margin:0 0 4px;font-weight:800">The truth</p><div class="q" style="font-size:22px">' + esc(truth.t) + '</div></div>' +
      '<div class="card center"><span class="stat" style="font-size:28px;color:var(--ink)">+' + num(me.gain) + '</span> <span class="muted">this round · ' + num(me.score) + ' total · ' + ord(rankOf(st, me.name) || 1) + '</span></div>' + lol +
      (st.phase === 'board' ? '<div class="card">' + scoreboard(st, 8, me.name) + '</div>' : '');
  }
  // end
  var won = (st.winners || []).indexOf(me.name) >= 0;
  var mineSt = '<div class="stickers">' + (me.lols ? '<div class="sticker">😂 LOL ×' + me.lols + '</div>' : '') + '<div class="sticker">🦊 Fooled<b>' + me.fooled + '</b></div><div class="sticker">🔎 Found the truth<b>' + me.truths + '×</b></div></div>';
  return '<div class="card center pop" style="padding:28px 16px">' + (won ? '<p style="margin:0 0 6px;font-weight:800;color:var(--accent);letter-spacing:.14em;text-transform:uppercase">You won!</p>' : '<p class="muted" style="margin:0 0 6px;font-weight:800;letter-spacing:.14em;text-transform:uppercase">' + ((st.winners || []).length > 1 ? 'Winners' : ((st.winners || []).length ? 'Winner' : '')) + '</p>') +
    '<div class="win" style="font-size:clamp(30px,9vw,48px)">' + winnersTxt(st) + '</div>' +
    '<p class="muted" style="margin:12px 0 0">You finished ' + ord(rankOf(st, me.name) || 1) + ' with ' + num(me.score) + ' points.</p></div>' + mineSt + stickersHtml(st) +
    '<p class="muted center small" style="margin:0">Waiting for the host to start the next game…</p>' +
    '<div class="card">' + scoreboard(st, 50, me.name) + '</div><button class="btn ghost wide sm" data-act="leave">Leave room</button>';
}
function lolHtml(st, me){
  var res = st.res; if (!res) return '';
  var list = res.rev.filter(function(o){ return !o.truth && !o.house && o.by.length && o.by.indexOf(me.name) < 0; });
  if (!list.length) return '';
  if (me.lol >= 0) {
    var g = res.rev.filter(function(o){ return o.i === me.lol; })[0];
    return '<div class="banner info">😂 You gave a LOL sticker' + (g ? ' to “' + esc(g.t) + '”' : '') + '.</div>';
  }
  return '<div class="card lolbox"><h2 style="font-size:18px">Funniest fake?</h2><p class="muted small" style="margin:0">Give it a LOL sticker. Its writer gets +125.</p>' + list.map(function(o){
    return '<button type="button" class="lolbtn" data-lol="' + o.i + '"><span class="e">😂</span><span>“' + esc(o.t) + '”</span></button>';
  }).join('') + '</div>';
}

// Host controls when the host plays on the same phone.
function vStrip(st, mirror){
  var b = '';
  if (st.phase === 'lobby') b = '<button class="btn go sm" data-act="start"' + (st.players.length ? '' : ' disabled') + '>Start game · ' + st.players.length + '</button>';
  else if (st.phase === 'rev' || st.phase === 'board') b = '<button class="btn sm" data-act="next">' + (st.phase === 'board' ? 'Next round' : (st.round >= st.rounds ? 'Winner' : 'Scores')) + '</button><button class="btn sm ghost" data-act="end">End game</button>';
  else if (st.phase === 'end') b = '<button class="btn go sm" data-act="again">Play again</button>';
  else if (st.phase === 'write' || st.phase === 'vote') b = '<button class="btn sm" data-act="next">' + (st.phase === 'write' ? 'Stop writing' : 'Stop voting') + '</button><button class="btn sm ghost" data-act="end">End game</button>';
  else b = '<button class="btn sm ghost" data-act="end">End game</button>';
  if (mirror) return '<div class="hoststrip mini">' + b + '<button class="btn sm ghost" data-act="mirroroff">Exit TV mode</button></div>';
  return '<div class="hoststrip"><span class="pill">Host</span>' + b + '<button class="btn sm ghost" data-act="tvsheet" aria-label="Show on TV">' + castIcon() + '</button><button class="btn sm ghost" data-act="hostscreen">Host screen</button></div>';
}

// ---------------------------------------------------------------- wiring
function wire(){
  var f = document.getElementById('joinf');
  if (f) f.addEventListener('submit', function(e){ e.preventDefault(); joinRoom(document.getElementById('jc').value, document.getElementById('jn').value); });
  var tf = document.getElementById('tvf');
  if (tf) {
    var tc = document.getElementById('tc');
    tc.addEventListener('input', function(){ tc.value = tc.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4); });
    tf.addEventListener('submit', function(e){ e.preventDefault(); var c = tc.value.toUpperCase().replace(/[^A-Z]/g,''); if (c.length !== 4) { S.err = 'The code is 4 letters.'; render(true); return; } S.err = ''; enterTv(c); });
  }
  var jc = document.getElementById('jc');
  if (jc && jc.type !== 'hidden') jc.addEventListener('input', function(){ jc.value = jc.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4); });

  // Settings on the home page: saved on this device for the next room.
  app.querySelectorAll('[data-hs]').forEach(function(b){
    b.addEventListener('click', function(){
      var k = b.getAttribute('data-hs'), v = b.getAttribute('data-v');
      if (k === 'cat') {
        var on = homeSel(), i = on.indexOf(v);
        if (i >= 0) { if (on.length === 1) { var n = document.getElementById('catnote-home'); if (n) n.textContent = 'Keep at least one category on.'; return; } on.splice(i, 1); } else on.push(v);
        sset(key('cats'), JSON.stringify(on));
      } else sset(key(k), +v);
      S.sig = ''; render(true);
    });
  });
  // Settings in the lobby: saved to the room.
  app.querySelectorAll('[data-rs]').forEach(function(b){
    b.addEventListener('click', function(){
      var k = b.getAttribute('data-rs'), v = b.getAttribute('data-v'), st = S.st;
      if (k === 'cat') {
        var on = (st.only && st.only.length) ? st.only.slice() : catIds(), i = on.indexOf(v);
        if (i >= 0) { if (on.length === 1) { var n = document.getElementById('catnote-room'); if (n) n.textContent = 'Keep at least one category on.'; return; } on.splice(i, 1); } else on.push(v);
        hostDo('settings', { cats: on });
      } else { var o = {}; o[k] = +v; hostDo('settings', o); }
    });
  });
  document.querySelectorAll('[data-act]').forEach(function(b){
    b.addEventListener('click', function(){
      var a = b.getAttribute('data-act');
      if (a === 'create') createRoom();
      else if (a === 'home' || a === 'newroom') goHome();
      else if (a === 'start' || a === 'next' || a === 'again') { b.disabled = true; hostDo(a); }
      else if (a === 'end') { if (confirmEnd(b)) hostDo('end'); }
      else if (a === 'copy') copy(link(S.code), b);
      else if (a === 'share') navigator.share({ title: 'Groupcade ' + CFG.gameName, text: 'Join my ' + CFG.gameName + ' game on Groupcade! Code ' + S.code, url: link(S.code) }).catch(function(){});
      else if (a === 'leave') { api('POST', '/rooms/' + S.code + '/leave').catch(function(){}); sset('gc_tok_' + S.code, null); goHome(); }
      else if (a === 'hostscreen') { if (APP && APP.nativeHost) appPost({ type: 'hostscreen', code: S.code }); else enterRoom(S.code, true); }
      else if (a === 'tvsheet') tvSheet();
      else if (a === 'mirroroff') mirror(false);
      else if (a === 'editfake') { S.editFake = S.st ? S.st.round : 0; S.fakeErr = ''; render(true); var fk = document.getElementById('fk'); if (fk) { fk.focus(); fk.select(); } }
      else if (a === 'playhere') {
        if (window.innerWidth > 820) window.open(link(S.code) + '?play=1', '_blank', 'noopener');
        else { stopPoll(); S.mode = 'join'; S.token = null; document.body.classList.remove('hostview'); S.sig = ''; render(true); }
      }
    });
  });
  app.querySelectorAll('[data-kick]').forEach(function(b){ b.addEventListener('click', function(){ hostDo('kick', { player: +b.getAttribute('data-kick') }); }); });
  app.querySelectorAll('[data-vote]').forEach(function(b){ b.addEventListener('click', function(){ vote(+b.getAttribute('data-vote')); }); });
  app.querySelectorAll('[data-lol]').forEach(function(b){ b.addEventListener('click', function(){ giveLol(+b.getAttribute('data-lol')); }); });
  var ff = document.getElementById('fakef'), fk = document.getElementById('fk');
  if (ff && fk) {
    var round = S.st ? S.st.round : 0;
    ff.addEventListener('submit', function(e){ e.preventDefault(); sendFake(fk.value); });
    fk.addEventListener('input', function(){ if (fk.value.length > MAXLEN) fk.value = fk.value.slice(0, MAXLEN); S.draft = fk.value; S.draftRound = round; countFake(fk); });
    fk.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendFake(fk.value); } });
    fk.addEventListener('focus', function(){ S.typing = round; });
    fk.addEventListener('blur', function(){ S.typing = 0; setTimeout(function(){ if (!S.typing) render(false); }, 250); });
  }
}

// Two taps to end a game, no browser dialog.
function confirmEnd(b){
  if (b.getAttribute('data-sure')) return true;
  b.setAttribute('data-sure', '1'); b.textContent = 'Tap again to end'; S.sig = 'x';
  setTimeout(function(){ if (b.isConnected) { b.removeAttribute('data-sure'); b.textContent = 'End game'; } }, 3000);
  return false;
}
function copy(t, b){
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ b.textContent = 'Copied!'; }).catch(function(){ prompt('Copy this link', t); });
}

// ---------------------------------------------------------------- start
var qs = new URLSearchParams(location.search);
var startCode = (S.code || qs.get('code') || '').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
if (CFG.cast) { startReceiver(); }
else if (CFG.tv) { S.mode = 'tv'; document.body.classList.add('hostview', 'tv'); if (startCode.length === 4) enterTv(startCode); else render(true); }
else if (startCode.length === 4) {
  // A host returning to their own room link gets the host screen, unless they came to play.
  enterRoom(startCode, !!sget('gc_host_' + startCode) && !sget('gc_tok_' + startCode) && qs.get('play') !== '1');
} else { render(true); }
if (!APP) loadAccount();
})();
</script>
